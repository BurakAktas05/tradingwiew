version: "3.8"

services:
  tradex-ai:
    build: .
    container_name: tradex_ai_platform
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.5-flash
    env_file:
      - ./backend/.env
